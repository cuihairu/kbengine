<path d="M60 1352 H120" class="edge" style="stroke:#475569;stroke-width:2"/>
<text x="130" y="1358" class="small" text-anchor="start">solid · business data flow</text>
<path d="M400 1352 H460" class="edge control" style="stroke:#64748b;stroke-width:2"/>
<text x="470" y="1358" class="small" text-anchor="start">dashed · control / scheduling / registration</text>
<path d="M820 1352 H880" class="edge" style="stroke:#7c3aed;stroke-width:2"/>
<text x="890" y="1358" class="small" text-anchor="start">purple · persistence</text>
<text x="40" y="1392" class="small" text-anchor="start">Crossings without a dot do not connect · components and data flow derived from kbe/src/server source · player path Client → LoginApp → BaseApp → CellApp → DBMgr</text>
</svg>
