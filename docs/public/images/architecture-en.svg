<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1420" viewBox="0 0 1280 1420" role="img" aria-labelledby="title desc" xml:lang="en-US">
<title id="title">KBEngine · Process Architecture</title>
<desc id="desc">Multi-process architecture of the KBEngine MMOG distributed game server engine. The player path is Client → LoginApp → BaseApp → CellApp → DBMgr. LoginApp handles access and authentication, BaseApp holds long-lived player logic and the client session, CellApp performs real-time space simulation (Space/AOI/Witness, real/ghost), and DBMgr centralizes persistence to MySQL / Redis. Peripheral processes include Machine (service registry), BaseAppMgr / CellAppMgr (schedulers), Logger (log aggregation), Interfaces (external gateway), and Bots (load-test clients). Dashed edges are control/scheduling/registration, solid edges are business data, purple edges are persistence.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="context-stroke"/></marker></defs>
<style>text{font-family:Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif;fill:#172b4d}.title{font-size:30px;font-weight:700}.name{font-size:22px;font-weight:700}.body{font-size:16px;fill:#435570}.small{font-size:14px;fill:#52647b}.subname{font-size:18px;font-weight:700}.label{font-size:14px;fill:#435570;paint-order:stroke;stroke:#f8fafc;stroke-width:5px;stroke-linejoin:round}.caption{font-size:14px;fill:#435570}.edge{fill:none;stroke-linejoin:round}.control{stroke-dasharray:7 5}</style>
<rect width="1280" height="1420" rx="20" fill="#f8fafc"/>
<text x="40" y="48" class="title" text-anchor="start">KBEngine · Process Architecture</text>
<text x="40" y="80" class="body" text-anchor="start">MMOG distributed game server engine · multi-process dynamic load balancing · player path Client→LoginApp→BaseApp→CellApp→DBMgr</text>

<!-- ===== Business data flow (main column, solid) ===== -->
<path d="M340 220 V300" fill="none" stroke="#f8fafc" stroke-width="9"/>
<path id="client-login" data-from="client" data-to="loginapp" d="M340 220 V300" class="edge" style="stroke:#475569;stroke-width:2" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
<path d="M340 420 V500" fill="none" stroke="#f8fafc" stroke-width="9"/>
<path id="login-base" data-from="loginapp" data-to="baseapp" d="M340 420 V500" class="edge" style="stroke:#475569;stroke-width:2" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
<path d="M340 700 V780" fill="none" stroke="#f8fafc" stroke-width="9"/>
<path id="base-cell" data-from="baseapp" data-to="cellapp" d="M340 700 V780" class="edge" style="stroke:#475569;stroke-width:2" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
<path d="M340 980 V1050" fill="none" stroke="#f8fafc" stroke-width="9"/>
<path id="cell-db" data-from="cellapp" data-to="dbmgr" d="M340 980 V1050" class="edge" style="stroke:#475569;stroke-width:2" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
<path d="M340 1180 V1240" fill="none" stroke="#f8fafc" stroke-width="9"/>
<path id="db-store" data-from="dbmgr" data-to="storage" d="M340 1180 V1240" class="edge" style="stroke:#7c3aed;stroke-width:2" marker-end="url(#arrow)" marker-start="url(#arrow)"/>

<!-- ===== Persistence / auth (left column, solid) ===== -->
<path d="M60 620 H22 V1120 H60" fill="none" stroke="#f8fafc" stroke-width="9"/>
<path id="base-db" data-from="baseapp" data-to="dbmgr" d="M60 620 H22 V1120 H60" class="edge" style="stroke:#7c3aed;stroke-width:2" marker-end="url(#arrow)"/>
<path d="M60 360 H42 V1100 H60" fill="none" stroke="#f8fafc" stroke-width="9"/>
<path id="login-db-auth" data-from="loginapp" data-to="dbmgr" d="M60 360 H42 V1100 H60" class="edge" style="stroke:#475569;stroke-width:2" marker-end="url(#arrow)" marker-start="url(#arrow)"/>

<!-- ===== Control / scheduling / registration (right column, dashed) ===== -->
<path d="M720 170 H644 V340 H620" fill="none" stroke="#f8fafc" stroke-width="9"/>
<path id="bots-login" data-from="bots" data-to="loginapp" d="M720 170 H644 V340 H620" class="edge control" style="stroke:#475569;stroke-width:2" marker-end="url(#arrow)"/>
<path d="M720 350 H652 V370 H620" fill="none" stroke="#f8fafc" stroke-width="9"/>
<path id="machine-login" data-from="machine" data-to="loginapp" d="M720 350 H652 V370 H620" class="edge control" style="stroke:#64748b;stroke-width:2" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
<path d="M720 365 H660 V600 H620" fill="none" stroke="#f8fafc" stroke-width="9"/>
<path id="machine-base" data-from="machine" data-to="baseapp" d="M720 365 H660 V600 H620" class="edge control" style="stroke:#64748b;stroke-width:2" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
<path d="M720 380 H668 V880 H620" fill="none" stroke="#f8fafc" stroke-width="9"/>
<path id="machine-cell" data-from="machine" data-to="cellapp" d="M720 380 H668 V880 H620" class="edge control" style="stroke:#64748b;stroke-width:2" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
<path d="M720 395 H676 V1115 H620" fill="none" stroke="#f8fafc" stroke-width="9"/>
<path id="machine-db" data-from="machine" data-to="dbmgr" d="M720 395 H676 V1115 H620" class="edge control" style="stroke:#64748b;stroke-width:2" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
<path d="M720 545 H692 V600 H620" fill="none" stroke="#f8fafc" stroke-width="9"/>
<path id="baseappmgr-base" data-from="baseappmgr" data-to="baseapp" d="M720 545 H692 V600 H620" class="edge control" style="stroke:#64748b;stroke-width:2" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
<path d="M720 675 H700 V880 H620" fill="none" stroke="#f8fafc" stroke-width="9"/>
<path id="cellappmgr-cell" data-from="cellappmgr" data-to="cellapp" d="M720 675 H700 V880 H620" class="edge control" style="stroke:#64748b;stroke-width:2" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
<path d="M720 805 H684 V740 H620" fill="none" stroke="#f8fafc" stroke-width="9"/>
<path id="logger-log" data-from="logger" data-to="baseapp" d="M720 805 H684 V740 H620" class="edge control" style="stroke:#64748b;stroke-width:2" marker-end="url(#arrow)"/>
<path d="M620 660 H688 V935 H720" fill="none" stroke="#f8fafc" stroke-width="9"/>
<path id="base-interfaces" data-from="baseapp" data-to="interfaces" d="M620 660 H688 V935 H720" class="edge control" style="stroke:#64748b;stroke-width:2" marker-end="url(#arrow)" marker-start="url(#arrow)"/>

<!-- ===== Main column boxes ===== -->
<g id="client" data-node="client"><rect x="60" y="120" width="560" height="100" rx="14" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
<text x="80" y="154" class="name" text-anchor="start">Client</text>
<text x="80" y="180" class="body" text-anchor="start">Unity / UE4 / OGRE / Cocos2d-js / HTML5 / Godot plugins</text>
<text x="80" y="204" class="small" text-anchor="start">TCP / UDP / KCP · login and game session</text>
</g>
<g id="loginapp" data-node="loginapp"><rect x="60" y="300" width="560" height="120" rx="14" fill="#eef2ff" stroke="#a5b4fc" stroke-width="1.5"/>
<text x="80" y="334" class="name" text-anchor="start">LoginApp · Access layer</text>
<text x="80" y="360" class="body" text-anchor="start">First-hop access · account auth · dispatch to the least-loaded BaseApp</text>
<text x="80" y="386" class="small" text-anchor="start">login() / reqCreateAccount() / onAccountLogin()</text>
</g>
<g id="baseapp" data-node="baseapp"><rect x="60" y="500" width="560" height="200" rx="14" fill="#eef8f5" stroke="#86c9b3" stroke-width="1.5"/>
<text x="80" y="534" class="name" text-anchor="start">BaseApp · Logic layer</text>
<text x="80" y="560" class="body" text-anchor="start">Long-lived player logic · client session binding · Backup / Archive</text>
<rect x="90" y="590" width="240" height="90" rx="10" fill="#fff" stroke="#86c9b3"/>
<text x="110" y="622" class="subname" text-anchor="start">Proxy</text>
<text x="110" y="650" class="small" text-anchor="start">client session anchor</text>
<rect x="350" y="590" width="240" height="90" rx="10" fill="#fff" stroke="#86c9b3"/>
<text x="370" y="622" class="subname" text-anchor="start">Base Entity</text>
<text x="370" y="650" class="small" text-anchor="start">long-lived logic · writeToDB</text>
</g>
<g id="cellapp" data-node="cellapp"><rect x="60" y="780" width="560" height="200" rx="14" fill="#edf5ff" stroke="#93b9e3" stroke-width="1.5"/>
<text x="80" y="814" class="name" text-anchor="start">CellApp · Space layer</text>
<text x="80" y="840" class="body" text-anchor="start">Real-time space simulation · main game tick · real / ghost</text>
<rect x="90" y="870" width="160" height="90" rx="10" fill="#fff" stroke="#93b9e3"/>
<text x="110" y="902" class="subname" text-anchor="start">Cell Entity</text>
<text x="110" y="930" class="small" text-anchor="start">real-time space subject</text>
<rect x="270" y="870" width="170" height="90" rx="10" fill="#fff" stroke="#93b9e3"/>
<text x="290" y="902" class="subname" text-anchor="start">Space / AOI / Witness</text>
<text x="290" y="930" class="small" text-anchor="start">AOI sync to client</text>
<rect x="460" y="870" width="140" height="90" rx="10" fill="#fff" stroke="#93b9e3"/>
<text x="480" y="902" class="subname" text-anchor="start">Ghost</text>
<text x="480" y="930" class="small" text-anchor="start">cross-process space proxy</text>
</g>
<g id="dbmgr" data-node="dbmgr"><rect x="60" y="1050" width="560" height="130" rx="14" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.5"/>
<text x="80" y="1084" class="name" text-anchor="start">DBMgr · Persistence layer</text>
<text x="80" y="1110" class="body" text-anchor="start">account/entity queries · writeToDB / removeEntity · entity ID allocation</text>
<text x="80" y="1136" class="small" text-anchor="start">online/offline boundary (EntityLog) · DBTask thread pool · single write entry</text>
</g>
<g id="storage" data-node="storage"><rect x="60" y="1240" width="560" height="80" rx="14" fill="#ede9fe" stroke="#a78bfa" stroke-width="1.5"/>
<text x="80" y="1274" class="name" text-anchor="start">MySQL + Redis storage</text>
<text x="80" y="1300" class="small" text-anchor="start">db_mysql authoritative persistence · db_redis high-speed data · connection pool</text>
</g>

<!-- ===== Right column boxes ===== -->
<g id="bots" data-node="bots"><rect x="720" y="120" width="520" height="100" rx="14" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
<text x="740" y="154" class="name" text-anchor="start">Bots · load-test clients</text>
<text x="740" y="180" class="body" text-anchor="start">scripted load-test bots · full client login path</text>
<text x="740" y="204" class="small" text-anchor="start">ClientApp base class · not a server component</text>
</g>
<g id="machine" data-node="machine"><rect x="720" y="300" width="520" height="130" rx="14" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
<text x="740" y="334" class="name" text-anchor="start">Machine · service registry</text>
<text x="740" y="360" class="body" text-anchor="start">UDP broadcast discovery · component register / query</text>
<text x="740" y="386" class="small" text-anchor="start">process start/stop supervision · watcher</text>
</g>
<g id="baseappmgr" data-node="baseappmgr"><rect x="720" y="500" width="520" height="90" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="740" y="534" class="name" text-anchor="start">BaseAppMgr</text>
<text x="740" y="560" class="small" text-anchor="start">findFreeBaseapp() · least-loaded BaseApp scheduling</text>
</g>
<g id="cellappmgr" data-node="cellappmgr"><rect x="720" y="630" width="520" height="90" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="740" y="664" class="name" text-anchor="start">CellAppMgr</text>
<text x="740" y="690" class="small" text-anchor="start">findFreeCellapp() · least-loaded CellApp scheduling</text>
</g>
<g id="logger" data-node="logger"><rect x="720" y="760" width="520" height="90" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="740" y="794" class="name" text-anchor="start">Logger</text>
<text x="740" y="820" class="small" text-anchor="start">centralized log aggregation (PythonApp)</text>
</g>
<g id="interfaces" data-node="interfaces"><rect x="720" y="890" width="520" height="90" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="740" y="924" class="name" text-anchor="start">Interfaces</text>
<text x="740" y="950" class="small" text-anchor="start">external gateway · billing / auth external integration</text>
</g>
<g id="ops" data-node="ops"><rect x="720" y="1020" width="520" height="80" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="740" y="1052" class="name" text-anchor="start">guiconsole · kbcmd</text>
<text x="740" y="1078" class="small" text-anchor="start">GUI management / CLI ops tooling</text>
</g>

<!-- ===== Main column edge labels ===== -->
<text x="352" y="266" class="label" text-anchor="start">TCP / KCP</text>
<text x="352" y="466" class="label" text-anchor="start">session handoff · via BaseAppMgr</text>
<text x="352" y="746" class="label" text-anchor="start">EntityCall · property sync</text>
<text x="352" y="1020" class="label" text-anchor="start">Cell state persistence</text>
<text x="352" y="1216" class="label" text-anchor="start" style="fill:#7c3aed">SQL / Redis reads &amp; writes</text>
<text transform="translate(16 870) rotate(-90)" class="label" text-anchor="middle" style="fill:#7c3aed">Base → DBMgr persistence</text>
<text transform="translate(36 730) rotate(-90)" class="label" text-anchor="middle">LoginApp → DBMgr account auth</text>

<!-- ===== Right column captions (control edge labels) ===== -->
<text x="736" y="236" class="caption" text-anchor="start">load-test client login path</text>
<text x="736" y="452" class="caption" text-anchor="start">component register / discover · UDP broadcast</text>
<text x="736" y="606" class="caption" text-anchor="start">↓ allocate least-loaded BaseApp</text>
<text x="736" y="736" class="caption" text-anchor="start">↓ allocate least-loaded CellApp</text>
<text x="736" y="866" class="caption" text-anchor="start">← collect logs from all components</text>
<text x="736" y="996" class="caption" text-anchor="start">→ billing / auth external integration</text>

