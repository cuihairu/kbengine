<text x="80" y="180" class="body" text-anchor="start">Unity / UE4 / OGRE / Cocos2d-js / HTML5 / Godot 插件</text>
<text x="80" y="204" class="small" text-anchor="start">TCP / UDP / KCP · 登录与游戏会话</text>
</g>
<g id="loginapp" data-node="loginapp"><rect x="60" y="300" width="560" height="120" rx="14" fill="#eef2ff" stroke="#a5b4fc" stroke-width="1.5"/>
