name: CI

on:
  push:
    branches:
      - master
      - chore/python-3.12-support
      - chore/cmake-bootstrap
  pull_request:
    branches:
      - master
      - chore/cmake-bootstrap

jobs:
  linux:
    name: Linux CMake
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf \
            autoconf-archive \
            automake \
            build-essential \
            cmake \
            libtool \
            ninja-build \
            pkg-config \
            zip \
            unzip \
            tar \
            curl

      - name: Bootstrap vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg.git "${GITHUB_WORKSPACE}/vcpkg"
          "${GITHUB_WORKSPACE}/vcpkg/bootstrap-vcpkg.sh" -disableMetrics

      - name: Configure
        env:
          VCPKG_ROOT: ${{ github.workspace }}/vcpkg
        run: cmake --preset vcpkg

      - name: Build
        env:
          VCPKG_ROOT: ${{ github.workspace }}/vcpkg
        run: >
          cmake --build --preset vcpkg --parallel
          --target
          kbe_machine
          kbe_baseappmgr
          kbe_baseapp
          kbe_cellappmgr
          kbe_cellapp
          kbe_dbmgr
          kbe_interfaces
          kbe_logger
          kbe_kbcmd
          kbe_loginapp
          kbe_bots
          kbe_smoke_tests

      - name: Test
        env:
          VCPKG_ROOT: ${{ github.workspace }}/vcpkg
        run: ctest --preset vcpkg --output-on-failure

  coverage:
    name: Code Coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf \
            autoconf-archive \
            automake \
            build-essential \
            cmake \
            gcc \
            lcov \
            libtool \
            ninja-build \
            pkg-config \
            zip \
            unzip \
            tar \
            curl
          # Verify installation
          gcov --version
          lcov --version

      - name: Bootstrap vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg.git "${GITHUB_WORKSPACE}/vcpkg"
          "${GITHUB_WORKSPACE}/vcpkg/bootstrap-vcpkg.sh" -disableMetrics

      - name: Configure with Coverage
        env:
          VCPKG_ROOT: ${{ github.workspace }}/vcpkg
        run: |
          cmake --preset vcpkg \
            -DCMAKE_BUILD_TYPE=Debug \
            -DKBE_ENABLE_CODE_COVERAGE=ON

      - name: Verify Coverage Flags
        env:
          VCPKG_ROOT: ${{ github.workspace }}/vcpkg
        run: |
          echo "=== Checking CMake configuration for coverage ==="
          grep -i "coverage\|ftest-coverage\|fprofile-arcs" build/presets/vcpkg/CMakeCache.txt || echo "No coverage flags in CMakeCache.txt"

          echo "=== Checking compilation flags in build directory ==="
          grep -r "ftest-coverage" build/presets/vcpkg/CMakeFiles/ 2>/dev/null | head -5 || echo "No coverage flags in CMakeFiles"

          echo "=== Testing executables ==="
          find build/presets/vcpkg -name "kbe_smoke_tests" -type f -ls -lh

      - name: Build with Coverage
        env:
          VCPKG_ROOT: ${{ github.workspace }}/vcpkg
        run: >
          cmake --build --preset vcpkg --parallel
          --target
          kbe_smoke_tests

      - name: Run Tests with Coverage
        env:
          VCPKG_ROOT: ${{ github.workspace }}/vcpkg
          GCOV_ERROR_STDERR: 1
        working-directory: build/presets/vcpkg
        run: |
          # Run tests to generate .gcda files
          echo "=== Running tests with coverage ==="
          ctest --output-on-failure || true

          echo "=== Checking for .gcda files after test execution ==="
          find . -name "*.gcda" -type f -ls -lh | head -20 || echo "No .gcda files found"

          echo "=== Checking for .gcno files ==="
          find . -name "*.gcno" -type f | wc -l

      - name: Generate Coverage Report
        env:
          VCPKG_ROOT: ${{ github.workspace }}/vcpkg
        working-directory: ${{ github.workspace }}
        run: |
          # Find where .gcda files are actually located
          echo "=== Searching for .gcda files ==="
          find build -name "*.gcda" -type f -ls -lh || echo "No .gcda files found in build/"

          echo "=== Searching for .gcno files ==="
          find build -name "*.gcno" -type f | head -20 || echo "No .gcno files found in build/"

          # Capture coverage from build directory where .gcda files are located
          lcov --capture \
            --directory build/presets/vcpkg \
            --base-directory . \
            --output-file coverage.info \
            --ignore-errors empty \
            --ignore-errors source

          # Check if we got any coverage data
          if [ -s coverage.info ]; then
            echo "=== Coverage data collected successfully ==="

            # Filter out test and build artifacts
            lcov --remove coverage.info '*/tests/*' --output-file coverage.info
            lcov --remove coverage.info 'kbe/src/lib/dependencies/*' --output-file coverage.info
            lcov --remove coverage.info '*/vcpkg/*' --output-file coverage.info
            lcov --remove coverage.info 'build/*' --output-file coverage.info
            lcov --remove coverage.info '*.o' --output-file coverage.info
            lcov --remove coverage.info '*.a' --output-file coverage.info

            # Show coverage summary
            echo "=== Final Coverage Summary ==="
            lcov --list coverage.info
          else
            echo "WARNING: coverage.info is empty or does not exist"
            echo "Creating empty coverage.info for debug"
            echo "No coverage data collected" > coverage.info
          fi

      - name: Upload to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.info
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  windows:
    name: Windows CMake
    runs-on: windows-2022
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Setup Ninja
        uses: seanmiddleditch/gha-setup-ninja@v5

      - name: Bootstrap vcpkg
        shell: pwsh
        run: |
          git clone https://github.com/microsoft/vcpkg.git "$env:GITHUB_WORKSPACE/vcpkg"
          & "$env:GITHUB_WORKSPACE/vcpkg/bootstrap-vcpkg.bat" -disableMetrics

      - name: Configure
        shell: pwsh
        env:
          VCPKG_ROOT: ${{ github.workspace }}\vcpkg
        run: cmake --preset vcpkg

      - name: Build
        shell: pwsh
        env:
          VCPKG_ROOT: ${{ github.workspace }}\vcpkg
        run: >
          cmake --build --preset vcpkg --parallel
          --target
          kbe_machine
          kbe_baseappmgr
          kbe_baseapp
          kbe_cellappmgr
          kbe_cellapp
          kbe_dbmgr
          kbe_interfaces
          kbe_logger
          kbe_kbcmd
          kbe_loginapp
          kbe_bots
          kbe_smoke_tests

      - name: Test
        shell: pwsh
        env:
          VCPKG_ROOT: ${{ github.workspace }}\vcpkg
        run: ctest --preset vcpkg --output-on-failure

  macos:
    name: macOS CMake
    runs-on: macos-14
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify toolchain
        run: |
          cmake --version
          ninja --version
          clang++ --version

      - name: Install autotools dependencies
        run: |
          brew install \
            autoconf \
            autoconf-archive \
            automake \
            libtool

      - name: Bootstrap vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg.git "${GITHUB_WORKSPACE}/vcpkg"
          "${GITHUB_WORKSPACE}/vcpkg/bootstrap-vcpkg.sh" -disableMetrics

      - name: Configure
        env:
          VCPKG_ROOT: ${{ github.workspace }}/vcpkg
        run: cmake --preset vcpkg

      - name: Build
        env:
          VCPKG_ROOT: ${{ github.workspace }}/vcpkg
        run: >
          cmake --build --preset vcpkg --parallel
          --target
          kbe_machine
          kbe_baseappmgr
          kbe_baseapp
          kbe_cellappmgr
          kbe_cellapp
          kbe_dbmgr
          kbe_interfaces
          kbe_logger
          kbe_kbcmd
          kbe_loginapp
          kbe_bots
          kbe_smoke_tests

      - name: Test
        env:
          VCPKG_ROOT: ${{ github.workspace }}/vcpkg
        run: ctest --preset vcpkg --output-on-failure
