name: CI

on:
  push:
    branches:
      - master
      - chore/python-3.12-support
      - chore/cmake-bootstrap
    paths-ignore:
      - 'docs/**'
      - '.github/workflows/docs.yml'
      - '*.md'
      - 'LICENSE'
  pull_request:
    branches:
      - master
      - chore/cmake-bootstrap
    paths-ignore:
      - 'docs/**'
      - '.github/workflows/docs.yml'
      - '*.md'
      - 'LICENSE'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  VCPKG_BASELINE: cb2981c4e03d421fa03b9bb5044cd1986180e7e4
  CTEST_TIMEOUT_SECONDS: 120

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux CMake
            os: ubuntu-24.04
            timeout: 65
          - name: Windows CMake
            os: windows-2022
            timeout: 65
          - name: macOS CMake
            os: macos-14
            timeout: 70

    steps:
      - name: Checkout
        timeout-minutes: 2
        uses: actions/checkout@v7

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        timeout-minutes: 8
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf \
            autoconf-archive \
            automake \
            build-essential \
            cmake \
            libtool \
            ninja-build \
            pkg-config \
            zip \
            unzip \
            tar \
            curl

      - name: Setup MSVC environment
        if: runner.os == 'Windows'
        timeout-minutes: 3
        uses: ilammy/msvc-dev-cmd@v1

      - name: Setup Ninja
        if: runner.os == 'Windows'
        timeout-minutes: 2
        uses: seanmiddleditch/gha-setup-ninja@v6

      - name: Verify macOS toolchain
        if: runner.os == 'macOS'
        timeout-minutes: 2
        run: |
          cmake --version
          ninja --version
          clang++ --version

      - name: Install macOS autotools dependencies
        if: runner.os == 'macOS'
        timeout-minutes: 8
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
        run: |
          brew install \
            autoconf \
            autoconf-archive \
            automake \
            libtool

      - name: Setup vcpkg
        timeout-minutes: 10
        id: setup_vcpkg
        uses: ./.github/actions/setup-vcpkg
        with:
          baseline: ${{ env.VCPKG_BASELINE }}
          cache-key: ${{ runner.os }}-vcpkg-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'vcpkg-ports/**') }}
          cache-restore-key: ${{ runner.os }}-vcpkg-

      - name: Install vcpkg dependencies
        timeout-minutes: 40
        run: ${{ steps.setup_vcpkg.outputs.vcpkg_executable }} install

      - name: Configure
        timeout-minutes: 12
        run: cmake --preset vcpkg

      - name: Build
        timeout-minutes: 20
        run: >
          cmake --build --preset vcpkg --parallel
          --target
          kbe_machine
          kbe_baseappmgr
          kbe_baseapp
          kbe_cellappmgr
          kbe_cellapp
          kbe_dbmgr
          kbe_interfaces
          kbe_logger
          kbe_kbcmd
          kbe_loginapp
          kbe_bots
          kbe_smoke_tests

      - name: Test
        timeout-minutes: 8
        run: >
          ctest --preset vcpkg --output-on-failure
          --timeout "${{ env.CTEST_TIMEOUT_SECONDS }}"
          -E "_NOT_BUILT$"

  coverage:
    name: Code Coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 85

    steps:
      - name: Checkout
        timeout-minutes: 2
        uses: actions/checkout@v7

      - name: Install Linux coverage dependencies
        timeout-minutes: 8
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf \
            autoconf-archive \
            automake \
            build-essential \
            cmake \
            gcc \
            lcov \
            libtool \
            ninja-build \
            pkg-config \
            zip \
            unzip \
            tar \
            curl
          # Verify installation
          gcov --version
          lcov --version

      - name: Setup vcpkg
        timeout-minutes: 10
        id: setup_vcpkg
        uses: ./.github/actions/setup-vcpkg
        with:
          baseline: ${{ env.VCPKG_BASELINE }}
          cache-key: ${{ runner.os }}-vcpkg-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'vcpkg-ports/**') }}
          cache-restore-key: ${{ runner.os }}-vcpkg-

      - name: Install vcpkg dependencies
        timeout-minutes: 40
        run: ${{ steps.setup_vcpkg.outputs.vcpkg_executable }} install

      - name: Configure with Coverage
        timeout-minutes: 12
        run: |
          cmake --preset vcpkg \
            -DCMAKE_BUILD_TYPE=Debug \
            -DKBE_ENABLE_CODE_COVERAGE=ON

      - name: Verify Coverage Flags
        timeout-minutes: 3
        run: |
          echo "=== Checking CMake configuration for coverage ==="
          grep -i "coverage\|ftest-coverage\|fprofile-arcs" build/presets/vcpkg/CMakeCache.txt || echo "No coverage flags in CMakeCache.txt"

          echo "=== Checking compilation flags in build directory ==="
          grep -r "ftest-coverage" build/presets/vcpkg/CMakeFiles/ 2>/dev/null | head -5 || echo "No coverage flags in CMakeFiles"

          echo "=== Testing executables ==="
          find build/presets/vcpkg -name "kbe_smoke_tests" -type f -ls

      - name: Build with Coverage
        timeout-minutes: 18
        run: >
          cmake --build --preset vcpkg --parallel
          --target
          kbe_smoke_tests

      - name: Run Tests with Coverage
        timeout-minutes: 10
        env:
          GCOV_ERROR_STDERR: 1
        working-directory: build/presets/vcpkg
        run: |
          # Run tests to generate .gcda files
          echo "=== Running tests with coverage ==="
          ctest --output-on-failure --timeout "${CTEST_TIMEOUT_SECONDS}" || true

          echo "=== Checking for .gcda files after test execution ==="
          find . -name "*.gcda" -type f -ls | head -20 || echo "No .gcda files found"

          echo "=== Checking for .gcno files ==="
          find . -name "*.gcno" -type f | wc -l

      - name: Generate Coverage Report
        timeout-minutes: 8
        working-directory: ${{ github.workspace }}
        run: |
          # Find where .gcda files are actually located
          echo "=== Searching for .gcda files ==="
          find build -name "*.gcda" -type f -ls || echo "No .gcda files found in build/"

          echo "=== Searching for .gcno files ==="
          find build -name "*.gcno" -type f | head -20 || echo "No .gcno files found in build/"

          # Capture coverage from build directory where .gcda files are located
          lcov --capture \
            --directory build/presets/vcpkg \
            --base-directory . \
            --output-file coverage.info \
            --ignore-errors empty \
            --ignore-errors source \
            --ignore-errors mismatch \
            --ignore-errors gcov \
            --ignore-errors gcov_module \
            --ignore-errors negative

          # Check if we got any coverage data
          if [ -s coverage.info ]; then
            echo "=== Coverage data collected successfully ==="

            # Filter out test and build artifacts
            lcov --remove coverage.info '*/tests/*' --output-file coverage.info --ignore-errors unused
            lcov --remove coverage.info 'kbe/src/lib/dependencies/*' --output-file coverage.info --ignore-errors unused
            lcov --remove coverage.info '*/vcpkg/*' --output-file coverage.info --ignore-errors unused
            lcov --remove coverage.info 'build/*' --output-file coverage.info --ignore-errors unused
            lcov --remove coverage.info '*.o' --output-file coverage.info --ignore-errors unused
            lcov --remove coverage.info '*.a' --output-file coverage.info --ignore-errors unused

            # Show coverage summary
            echo "=== Final Coverage Summary ==="
            lcov --list coverage.info
          else
            echo "WARNING: coverage.info is empty or does not exist"
            echo "Creating empty coverage.info for debug"
            echo "No coverage data collected" > coverage.info
          fi

      - name: Upload to Codecov
        timeout-minutes: 3
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.info
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
