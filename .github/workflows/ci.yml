name: CI

on:
  push:
    branches:
      - master
      - chore/python-3.12-support
      - chore/cmake-bootstrap
  pull_request:

jobs:
  linux:
    name: Linux CMake
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            pkg-config \
            zip \
            unzip \
            tar \
            curl

      - name: Bootstrap vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg.git "${GITHUB_WORKSPACE}/vcpkg"
          "${GITHUB_WORKSPACE}/vcpkg/bootstrap-vcpkg.sh" -disableMetrics

      - name: Configure
        env:
          VCPKG_ROOT: ${{ github.workspace }}/vcpkg
        run: cmake --preset vcpkg

      - name: Build
        env:
          VCPKG_ROOT: ${{ github.workspace }}/vcpkg
        run: >
          cmake --build --preset vcpkg --parallel
          --target
          kbe_machine
          kbe_baseappmgr
          kbe_baseapp
          kbe_cellappmgr
          kbe_cellapp
          kbe_dbmgr
          kbe_interfaces
          kbe_logger
          kbe_kbcmd
          kbe_loginapp
          kbe_bots
          kbe_smoke_tests

      - name: Test
        env:
          VCPKG_ROOT: ${{ github.workspace }}/vcpkg
        run: ctest --preset vcpkg --output-on-failure

  windows:
    name: Windows CMake
    runs-on: windows-2022
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Setup Ninja
        uses: seanmiddleditch/gha-setup-ninja@v5

      - name: Bootstrap vcpkg
        shell: pwsh
        run: |
          git clone https://github.com/microsoft/vcpkg.git "$env:GITHUB_WORKSPACE/vcpkg"
          & "$env:GITHUB_WORKSPACE/vcpkg/bootstrap-vcpkg.bat" -disableMetrics

      - name: Configure
        shell: pwsh
        env:
          VCPKG_ROOT: ${{ github.workspace }}\vcpkg
        run: cmake --preset vcpkg

      - name: Build
        shell: pwsh
        env:
          VCPKG_ROOT: ${{ github.workspace }}\vcpkg
        run: >
          cmake --build --preset vcpkg --parallel
          --target
          kbe_machine
          kbe_baseappmgr
          kbe_baseapp
          kbe_cellappmgr
          kbe_cellapp
          kbe_dbmgr
          kbe_interfaces
          kbe_logger
          kbe_kbcmd
          kbe_loginapp
          kbe_bots
          kbe_smoke_tests

      - name: Test
        shell: pwsh
        env:
          VCPKG_ROOT: ${{ github.workspace }}\vcpkg
        run: ctest --preset vcpkg --output-on-failure

  macos:
    name: macOS CMake
    runs-on: macos-14
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify toolchain
        run: |
          cmake --version
          ninja --version
          clang++ --version

      - name: Bootstrap vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg.git "${GITHUB_WORKSPACE}/vcpkg"
          "${GITHUB_WORKSPACE}/vcpkg/bootstrap-vcpkg.sh" -disableMetrics

      - name: Configure
        env:
          VCPKG_ROOT: ${{ github.workspace }}/vcpkg
        run: cmake --preset vcpkg

      - name: Build
        env:
          VCPKG_ROOT: ${{ github.workspace }}/vcpkg
        run: >
          cmake --build --preset vcpkg --parallel
          --target
          kbe_machine
          kbe_baseappmgr
          kbe_baseapp
          kbe_cellappmgr
          kbe_cellapp
          kbe_dbmgr
          kbe_interfaces
          kbe_logger
          kbe_kbcmd
          kbe_loginapp
          kbe_bots
          kbe_smoke_tests

      - name: Test
        env:
          VCPKG_ROOT: ${{ github.workspace }}/vcpkg
        run: ctest --preset vcpkg --output-on-failure
