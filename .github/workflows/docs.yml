name: Deploy Documentation

on:
  push:
    branches:
      - master
    paths:
      - 'docs-vuepress/**'
      - '.github/workflows/docs.yml'
      - 'package.json'
      - 'package-lock.json'
  pull_request:
    branches:
      - master
    paths:
      - 'docs-vuepress/**'
      - '.github/workflows/docs.yml'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: docs-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        timeout-minutes: 2
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        timeout-minutes: 4
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        timeout-minutes: 8
        run: npm ci

      - name: Build VuePress
        timeout-minutes: 12
        run: npm run docs:build

      - name: Upload artifact
        timeout-minutes: 3
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs-vuepress/.vuepress/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build
    if: github.event_name != 'pull_request'
    steps:
      - name: Deploy to GitHub Pages
        timeout-minutes: 10
        id: deployment
        uses: actions/deploy-pages@v4
