<path d="M720 170 H644 V340 H620" fill="none" stroke="#f8fafc" stroke-width="9"/>
<path id="bots-login" data-from="bots" data-to="loginapp" d="M720 170 H644 V340 H620" class="edge control" style="stroke:#475569;stroke-width:2" marker-end="url(#arrow)"/>
