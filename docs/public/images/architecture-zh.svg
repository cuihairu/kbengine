<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1420" viewBox="0 0 1280 1420" role="img" aria-labelledby="title desc" xml:lang="zh-CN">
<title id="title">KBEngine · 进程架构</title>
<desc id="desc">MMOG 分布式游戏服务端引擎的多进程架构。玩家主线 Client → LoginApp → BaseApp → CellApp → DBMgr。LoginApp 负责接入与认证，BaseApp 承载玩家长期逻辑与客户端会话，CellApp 负责实时空间模拟（Space/AOI/Witness、real/ghost），DBMgr 统一持久化到 MySQL / Redis。外围有 Machine 服务注册中心、BaseAppMgr / CellAppMgr 调度器、Logger 日志汇聚、Interfaces 外部接口网关、Bots 压测客户端。虚线为控制/调度/注册，实线为业务数据，紫色为持久化。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="context-stroke"/></marker></defs>
<style>text{font-family:Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif;fill:#172b4d}.title{font-size:30px;font-weight:700}.name{font-size:22px;font-weight:700}.body{font-size:16px;fill:#435570}.small{font-size:14px;fill:#52647b}.subname{font-size:18px;font-weight:700}.label{font-size:14px;fill:#435570;paint-order:stroke;stroke:#f8fafc;stroke-width:5px;stroke-linejoin:round}.caption{font-size:14px;fill:#435570}.edge{fill:none;stroke-linejoin:round}.control{stroke-dasharray:7 5}</style>
<rect width="1280" height="1420" rx="20" fill="#f8fafc"/>
<text x="40" y="48" class="title" text-anchor="start">KBEngine · 进程架构</text>
<text x="40" y="80" class="body" text-anchor="start">MMOG 分布式游戏服务端引擎 · 多进程动态负载均衡 · 玩家主线 Client→LoginApp→BaseApp→CellApp→DBMgr</text>

<!-- ===== 业务数据流（主列，实线） ===== -->
<path d="M340 220 V300" fill="none" stroke="#f8fafc" stroke-width="9"/>
<path id="client-login" data-from="client" data-to="loginapp" d="M340 220 V300" class="edge" style="stroke:#475569;stroke-width:2" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
<path d="M340 420 V500" fill="none" stroke="#f8fafc" stroke-width="9"/>
<path id="login-base" data-from="loginapp" data-to="baseapp" d="M340 420 V500" class="edge" style="stroke:#475569;stroke-width:2" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
<path d="M340 700 V780" fill="none" stroke="#f8fafc" stroke-width="9"/>
<path id="base-cell" data-from="baseapp" data-to="cellapp" d="M340 700 V780" class="edge" style="stroke:#475569;stroke-width:2" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
<path d="M340 980 V1050" fill="none" stroke="#f8fafc" stroke-width="9"/>
<path id="cell-db" data-from="cellapp" data-to="dbmgr" d="M340 980 V1050" class="edge" style="stroke:#475569;stroke-width:2" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
<path d="M340 1180 V1240" fill="none" stroke="#f8fafc" stroke-width="9"/>
<path id="db-store" data-from="dbmgr" data-to="storage" d="M340 1180 V1240" class="edge" style="stroke:#7c3aed;stroke-width:2" marker-end="url(#arrow)" marker-start="url(#arrow)"/>

<!-- ===== 持久化 / 认证（左列，实线） ===== -->
<path d="M60 620 H22 V1120 H60" fill="none" stroke="#f8fafc" stroke-width="9"/>
<path id="base-db" data-from="baseapp" data-to="dbmgr" d="M60 620 H22 V1120 H60" class="edge" style="stroke:#7c3aed;stroke-width:2" marker-end="url(#arrow)"/>
<path d="M60 360 H42 V1100 H60" fill="none" stroke="#f8fafc" stroke-width="9"/>
<path id="login-db-auth" data-from="loginapp" data-to="dbmgr" d="M60 360 H42 V1100 H60" class="edge" style="stroke:#475569;stroke-width:2" marker-end="url(#arrow)" marker-start="url(#arrow)"/>

