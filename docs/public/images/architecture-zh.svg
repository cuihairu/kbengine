<text x="80" y="360" class="body" text-anchor="start">第一跳接入 · 账号认证 · 分发到最空闲 BaseApp</text>
<text x="80" y="386" class="small" text-anchor="start">login() / reqCreateAccount() / onAccountLogin()</text>
