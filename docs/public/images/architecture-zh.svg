<text x="80" y="1136" class="small" text-anchor="start">在线/离线边界（EntityLog）· DBTask 线程池 · 全局唯一写入口</text>
</g>
<g id="storage" data-node="storage"><rect x="60" y="1240" width="560" height="80" rx="14" fill="#ede9fe" stroke="#a78bfa" stroke-width="1.5"/>
